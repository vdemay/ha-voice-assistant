# EchoEar V1.0/V1.1 (ESP32-S3) — minimum voice assistant WITH status on the screen.
# Based on minimum_assistant.yaml; adds the 360x360 round QSPI display
# (MIPI SPI JC3636W518V2) showing the current assistant state.
#
# V1.0/V1.1 display wiring (differs from EchoEar 1.2!):
#   QSPI: clk GPIO18, data [46, 13, 11, 12], CS GPIO14, RESET GPIO3
#   backlight: GPIO44 (LEDC)
#
# Plain API (no encryption key). Only needs wifi_ssid / wifi_password in secrets.yaml.

substitutions:
  name: echoear-status
  friendly_name: EchoEar Status
  imagewidth: "360"
  imageheight: "360"
  rotate_display: "0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - delay: 3s
      # ES8311 DAC hardware volume (default 0.75 = 0dB). Keep at/below 0.8 —
      # above that the NS4150B amp clips when combined with software volume.
      - lambda: id(es8311_dac)->set_volume(0.8f);
      - script.execute:
          id: set_status
          text: "Waiting for wake word"
      - micro_wake_word.start:
      - logger.log: "BOOT OK - wake word engine started"
# NOTE: do NOT call box_mic.start()/stop() manually from on_boot — the i2s mic
# start/stop is a counting semaphore driven from the main loop; blocking the loop
# with delay() while the mic is "starting" makes stop() a no-op and leaks a token,
# leaving the I2S bus locked forever ("Parent bus is busy" on the speaker).

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: "RZ7D3EzJdPM6"

captive_portal:

api:
  on_client_connected:
    - logger.log: "Home Assistant connected"
  on_client_disconnected:
    - logger.log: "Home Assistant disconnected (wake word still works)"

# --- I2C: ES7210 (ADC), ES8311 (codec), BQ27220 (fuel gauge), CST816 (touch) ---
i2c:
  - id: bus_a
    scl: GPIO1
    sda: GPIO2
    frequency: 100kHz
    scan: true   # logs every found address at boot

# --- I2S shared bus (mic + speaker) ---
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO39
    i2s_bclk_pin: GPIO40
    i2s_mclk_pin: GPIO42

audio_adc:
  - platform: es7210
    i2c_id: bus_a
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8311
    i2c_id: bus_a
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 48000

# --- Power rails (EchoEar V1.0/V1.1) ---
power_supply:
  - id: vcc3v3_sw
    pin:
      number: GPIO9
      inverted: true
    enable_time: 150ms
    enable_on_boot: true
  # NS4150B speaker amplifier enable: GPIO4 on V1.0/V1.1 (GPIO15 on V1.2)
  - id: spk_en
    pin:
      number: GPIO4
      inverted: false
    enable_time: 150ms
    enable_on_boot: true

# --- Microphone: ES7210 -> I2S. DIN is GPIO15 on V1.0/V1.1 (GPIO3 on V1.2) ---
microphone:
  - platform: i2s_audio
    id: box_mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO15
    adc_type: external
    channel: left
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit

# --- Speaker: ES8311 DAC -> I2S DOUT GPIO41 ---
speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO41
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 48000
    channel: mono

media_player:
  - platform: speaker
    name: None
    id: external_media_player
    # volume_initial defaults to 0.5 -> announcements play at half volume.
    # Don't exceed ~0.8: with the DAC at full scale the amp saturates (upstream
    # comment: "don't go higher than 0.8").
    volume_min: 0.3
    volume_max: 0.8
    volume_initial: 0.7
    announcement_pipeline:
      speaker: box_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    buffer_size: 100000
    # Mic and speaker share one I2S bus: free it for announcements,
    # take it back when playback is done.
    on_announcement:
      - script.execute:
          id: set_status
          text: "Replying..."
      - micro_wake_word.stop:
    on_idle:
      - script.execute:
          id: set_status
          text: "Waiting for wake word"
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - micro_wake_word.start:

# --- Wake word: only "ok nabu" ---
micro_wake_word:
  id: mww
  models:
    - okay_nabu
  on_wake_word_detected:
    - logger.log:
        level: INFO
        format: "!!! WAKE WORD DETECTED: %s !!!"
        args: ['wake_word.c_str()']
    - lambda: id(va).set_use_wake_word(false);
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
    # stop_after_detection stops mww; if VA could not start (e.g. HA not connected
    # yet -> "No API client connected"), restart detection so the next "ok nabu" works.
    - delay: 2s
    - if:
        condition:
          not:
            voice_assistant.is_running:
        then:
          - logger.log: "VA did not start -> restarting wake word engine"
          - micro_wake_word.start:

voice_assistant:
  id: va
  microphone: box_mic
  media_player: external_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - logger.log: "VA: listening..."
    - script.execute:
        id: set_status
        text: "Listening..."
  on_stt_end:
    - logger.log:
        level: INFO
        format: "VA: STT heard: %s"
        args: ['x.c_str()']
    - script.execute:
        id: set_status
        text: "Thinking..."
  on_tts_start:
    - logger.log:
        level: INFO
        format: "VA: TTS reply: %s"
        args: ['x.c_str()']
    - script.execute:
        id: set_status
        text: "Replying..."
  on_end:
    - logger.log: "VA: ended"
    # The TTS announcement starts slightly AFTER the pipeline ends. Wait for it
    # to begin, then wait for it to finish, THEN show Idle and restart the wake
    # word engine — otherwise mww grabs the shared I2S bus and the speaker can
    # never start. While waiting, the screen keeps showing "Talking...".
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        condition:
          - and:
              - not:
                  media_player.is_announcing:
              - not:
                  speaker.is_playing:
                    id: box_speaker
        timeout: 30s
    - script.execute:
        id: set_status
        text: "Waiting for wake word"
    - logger.log: "VA: ended -> restarting wake word engine"
    - micro_wake_word.start:
  on_error:
    - logger.log:
        level: ERROR
        format: "VA: error: %s - %s"
        args: ['code.c_str()', 'message.c_str()']
    - script.execute:
        id: set_status
        text: !lambda 'return "Error: " + code;'
    - delay: 1s
    - if:
        condition:
          not:
            voice_assistant.is_running:
        then:
          - micro_wake_word.start:

# BOOT button (GPIO0) as manual trigger fallback
binary_sensor:
  - platform: gpio
    pin:
      number: 0
      mode: INPUT_PULLUP
      ignore_strapping_warning: true
      inverted: true
    id: boot_button
    on_press:
      - logger.log: "BOOT button pressed"
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.stop:
            - voice_assistant.start:
          else:
            - voice_assistant.stop:

# --- Backlight (GPIO44, LEDC) ---
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO44
    inverted: false

light:
  - platform: monochromatic
    id: screen_backlight
    name: "Screen Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# --- Display: 360x360 round QSPI LCD, JC3636W518V2 (EchoEar V1.0/V1.1 pins) ---
spi:
  id: display_qspi
  type: quad
  clk_pin: 18
  data_pins: [46, 13, 11, 12]

display:
  - platform: mipi_spi
    id: main_display
    model: JC3636W518V2
    cs_pin: 14
    reset_pin: 3          # GPIO3 on V1.0/V1.1 (GPIO4 on V1.2)
    rotation: ${rotate_display}
    update_interval: never   # we redraw manually via set_status
    dimensions:
      height: ${imageheight}
      width: ${imagewidth}
    pages:
      - id: status_page
        lambda: |-
          it.fill(Color::BLACK);
          // status line, centered
          it.printf(it.get_width() / 2, it.get_height() / 2 - 10, id(status_font),
                    Color::WHITE, TextAlign::CENTER, "%s", id(status_line).c_str());
          // hint at the bottom
          it.printf(it.get_width() / 2, it.get_height() - 40, id(status_font_small),
                    Color(120, 120, 120), TextAlign::CENTER, "ok nabu");

font:
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: status_font
    size: 28
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: status_font_small
    size: 16

globals:
  - id: status_line
    type: std::string
    restore_value: no
    initial_value: '"Booting..."'

script:
  - id: set_status
    parameters:
      text: string
    then:
      - lambda: id(status_line) = text;
      - display.page.show: status_page
      - component.update: main_display

interval:
  - interval: 10s
    then:
      - lambda: |-
          ESP_LOGI("MAIN", "heartbeat: free_heap=%u mic_running=%d va_running=%d",
                   (unsigned) esp_get_free_heap_size(),
                   (int) id(box_mic).is_running(),
                   (int) id(va).is_running());
