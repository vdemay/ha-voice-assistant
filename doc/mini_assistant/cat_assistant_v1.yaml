# EchoEar V1.0/V1.1 (ESP32-S3) — "Cat Assistant v1": cat-face status display with
# awake-idle glance animation and a sleeping mode after 3 min of inactivity.
#
# Based on with_images_touch_sound.yaml (keeps all its behaviors: touch-to-talk
# with stop-first, wake-word ding, BOOT button, I2S bus arbitration, instant
# redraw on phase change). Changes for v1:
#   - advanced cat image set (images/advanced, rendered from the HTML page)
#   - phase 0 = awake idle: centered eyes (idle.png), with a sporadic slow
#     glance (idle_f1..f3, 2-3 frames out and back, 450 ms/frame, every ~2 s
#     with 30% chance — same behavior as the HTML page preview)
#   - phase 6 = sleeping (idle_sleep_f0..f3 looped at 5 fps), entered after
#     3 min without activity; wake word / touch / BOOT return to awake idle
#   - on wake word the status goes to awake idle (phase 0) before listening
#   - 14 images x 360x360 x 2B ~ 3.6 MB flash -> esp32 flash_size: 32MB
#
# V1.0/V1.1 wiring (differs from EchoEar 1.2!):
#   QSPI display: clk GPIO18, data [46,13,11,12], CS GPIO14, RESET GPIO3, backlight GPIO44
#   mic I2S DIN GPIO15, speaker amp enable GPIO4, touch CST816 irq GPIO10 on bus_a
#
# Plain API (no encryption key). Only needs wifi_ssid / wifi_password in secrets.yaml.

substitutions:
  name: cat-assistant-v1
  friendly_name: Cat Assistant v1
  imagewidth: "360"
  imageheight: "360"
  rotate_display: "0"
  # Advanced cat set, fetched at build time from this repo's raw URL (needs the
  # branch pushed). Rendered from images/advanced/esp32-cat-eyes-360x360-pngs.html
  # — regenerate with images/advanced/generate_advanced.py; for a local/offline
  # build use img_base: images/advanced instead (copy images/ next to the yaml).
  img_base: https://raw.githubusercontent.com/vdemay/ha-voice-assistant/main/doc/mini_assistant/images/advanced
  wake_sound_url: https://github.com/RealDeco/xiaozhi-esphome/raw/main/sounds/wake_word_triggered.flac

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - delay: 3s
      # ES8311 DAC hardware volume (default 0.75 = 0dB). Keep at/below 0.8 —
      # above that the NS4150B amp clips when combined with software volume.
      - lambda: id(es8311_dac)->set_volume(0.8f);
      - script.execute:
          id: set_status
          phase: 0
          label: "Waiting for wake word"
      - micro_wake_word.start:
      - logger.log: "BOOT OK - wake word engine started"
# NOTE: do NOT call box_mic.start()/stop() manually from on_boot — the i2s mic
# start/stop is a counting semaphore driven from the main loop; blocking the loop
# with delay() while the mic is "starting" makes stop() a no-op and leaks a token,
# leaving the I2S bus locked forever ("Parent bus is busy" on the speaker).

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 32MB   # 14 status images ~ 3.6 MB decoded RGB565
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: "RZ7D3EzJdPM6"
  on_connect:
    - logger.log: "WiFi connected"

captive_portal:

api:
  on_client_connected:
    - logger.log: "Home Assistant connected"
  on_client_disconnected:
    - logger.log: "Home Assistant disconnected (wake word still works)"

http_request:

# --- I2C: ES7210 (ADC), ES8311 (codec), BQ27220 (fuel gauge), CST816 (touch) ---
i2c:
  - id: bus_a
    scl: GPIO1
    sda: GPIO2
    frequency: 100kHz
    scan: true   # logs every found address at boot

# --- I2S shared bus (mic + speaker) ---
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO39
    i2s_bclk_pin: GPIO40
    i2s_mclk_pin: GPIO42

audio_adc:
  - platform: es7210
    i2c_id: bus_a
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8311
    i2c_id: bus_a
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 48000

# --- Power rails (EchoEar V1.0/V1.1) ---
power_supply:
  - id: vcc3v3_sw
    pin:
      number: GPIO9
      inverted: true
    enable_time: 150ms
    enable_on_boot: true
  # NS4150B speaker amplifier enable: GPIO4 on V1.0/V1.1 (GPIO15 on V1.2)
  - id: spk_en
    pin:
      number: GPIO4
      inverted: false
    enable_time: 150ms
    enable_on_boot: true

# --- Microphone: ES7210 -> I2S. DIN is GPIO15 on V1.0/V1.1 (GPIO3 on V1.2) ---
microphone:
  - platform: i2s_audio
    id: box_mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO15
    adc_type: external
    channel: left
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit

# --- Speaker: ES8311 DAC -> I2S DOUT GPIO41 ---
speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO41
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 48000
    channel: mono

media_player:
  - platform: speaker
    name: None
    id: external_media_player
    # volume_initial defaults to 0.5 -> quiet. Cap at 0.8: with the DAC at full
    # scale the NS4150B amp saturates (upstream: "don't go higher than 0.8").
    volume_min: 0.3
    volume_max: 0.8
    volume_initial: 0.7
    announcement_pipeline:
      speaker: box_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    buffer_size: 100000
    # Mic and speaker share one I2S bus: free it for announcements,
    # take it back when playback is done. These callbacks must NOT touch the
    # status image: the wake ding is an announcement too, so setting phases
    # here made the eyes flicker (listening -> replying -> idle) on every
    # "ok nabu". Only voice_assistant events change the image.
    on_announcement:
      - micro_wake_word.stop:
    on_idle:
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - micro_wake_word.start:
    files:
      - id: wake_word_triggered_sound
        file: ${wake_sound_url}

# --- Wake word: only "ok nabu", with a ding on detection ---
micro_wake_word:
  id: mww
  models:
    - okay_nabu
  on_wake_word_detected:
    - logger.log:
        level: INFO
        format: "!!! WAKE WORD DETECTED: %s !!!"
        args: ['wake_word.c_str()']
    # wake word -> awake idle (phase 0), even from sleeping mode (phase 6)
    - script.execute:
        id: set_status
        phase: 0
        label: "Wake word detected"
    # play the wake sound (mww auto-stops after detection -> I2S bus is free)
    - media_player.speaker.play_on_device_media_file:
        media_file: wake_word_triggered_sound
        announcement: true
    - delay: 300ms
    - lambda: id(va).set_use_wake_word(false);
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
    # stop_after_detection stops mww; if VA could not start (e.g. HA not connected
    # yet -> "No API client connected"), restart detection so the next "ok nabu" works.
    - delay: 2s
    - if:
        condition:
          not:
            voice_assistant.is_running:
        then:
          - logger.log: "VA did not start -> restarting wake word engine"
          - micro_wake_word.start:

voice_assistant:
  id: va
  microphone: box_mic
  media_player: external_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - logger.log: "VA: listening..."
    - script.execute:
        id: set_status
        phase: 1
        label: "Listening..."
  on_stt_end:
    - logger.log:
        level: INFO
        format: "VA: STT heard: %s"
        args: ['x.c_str()']
    - script.execute:
        id: set_status
        phase: 2
        label: "Thinking..."
  on_tts_start:
    - logger.log:
        level: INFO
        format: "VA: TTS reply: %s"
        args: ['x.c_str()']
    - script.execute:
        id: set_status
        phase: 3
        label: "Replying..."
  on_end:
    - logger.log: "VA: ended"
    # The TTS announcement starts slightly AFTER the pipeline ends. Wait for it
    # to begin, then wait for it to finish, THEN show idle and restart the wake
    # word engine — otherwise mww grabs the shared I2S bus and the speaker can
    # never start. While waiting, the screen keeps showing the replying image.
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        condition:
          - and:
              - not:
                  media_player.is_announcing:
              - not:
                  speaker.is_playing:
                    id: box_speaker
        timeout: 30s
    - script.execute:
        id: set_status
        phase: 0
        label: "Waiting for wake word"
    - logger.log: "VA: ended -> restarting wake word engine"
    - micro_wake_word.start:
  on_error:
    - logger.log:
        level: ERROR
        format: "VA: error: %s - %s"
        args: ['code.c_str()', 'message.c_str()']
    - script.execute:
        id: set_status
        phase: 4
        label: !lambda 'return "Error: " + code;'
    - delay: 1s
    - if:
        condition:
          not:
            voice_assistant.is_running:
        then:
          - micro_wake_word.start:

# BOOT button (GPIO0) as manual trigger fallback
binary_sensor:
  - platform: gpio
    pin:
      number: 0
      mode: INPUT_PULLUP
      ignore_strapping_warning: true
      inverted: true
    id: boot_button
    on_press:
      - logger.log: "BOOT button pressed"
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - media_player.stop:
                id: external_media_player
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.stop:
            - voice_assistant.start:
          else:
            - voice_assistant.stop:

# --- Backlight (GPIO44, LEDC) ---
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO44
    inverted: false

light:
  - platform: monochromatic
    id: screen_backlight
    name: "Screen Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# --- Display: 360x360 round QSPI LCD, JC3636W518V2 (EchoEar V1.0/V1.1 pins) ---
spi:
  id: display_qspi
  type: quad
  clk_pin: 18
  data_pins: [46, 13, 11, 12]

# --- Touchscreen: CST816 on bus_a, interrupt GPIO10.
# Touch = stop whatever is running (media playback/announcement), then listen.
touchscreen:
  - platform: cst816
    id: my_touchscreen
    interrupt_pin: GPIO10
    display: main_display
    i2c_id: bus_a
    on_touch:
      then:
        - logger.log: "Touch detected"
        - if:
            condition:
              not:
                voice_assistant.is_running:
            then:
              # stop any other running task first (frees the speaker too)
              - media_player.stop:
                  id: external_media_player
              - script.execute:
                  id: set_status
                  phase: 1
                  label: "Listening... (touch)"
              - lambda: id(va).set_use_wake_word(false);
              - micro_wake_word.stop:
              # ding on touch, same as on wake word detection
              - media_player.speaker.play_on_device_media_file:
                  media_file: wake_word_triggered_sound
                  announcement: true
              - delay: 300ms
              - voice_assistant.start:
            else:
              # touch while running = stop the current process, no ding,
              # and cut any sound still playing
              - media_player.stop:
                  id: external_media_player
              - voice_assistant.stop:

# --- Status images (advanced cat set) baked into the firmware at compile time ---
# `image:` with a local `file:` path is read at build time — no runtime HTTP,
# no wifi dependency. 14 images x 360x360 x 2 bytes ~ 3.6 MB of flash (hence
# flash_size: 32MB above).
image:
  - file: ${img_base}/loading.png
    id: img_loading
    resize: ${imagewidth}x${imageheight}
    type: RGB565
  - file: ${img_base}/idle.png
    id: img_idle
    resize: ${imagewidth}x${imageheight}
    type: RGB565
  - file: ${img_base}/idle_f1.png
    id: img_idle_f1
    resize: ${imagewidth}x${imageheight}
    type: RGB565
  - file: ${img_base}/idle_f2.png
    id: img_idle_f2
    resize: ${imagewidth}x${imageheight}
    type: RGB565
  - file: ${img_base}/idle_f3.png
    id: img_idle_f3
    resize: ${imagewidth}x${imageheight}
    type: RGB565
  - file: ${img_base}/idle_sleep_f0.png
    id: img_sleep0
    resize: ${imagewidth}x${imageheight}
    type: RGB565
  - file: ${img_base}/idle_sleep_f1.png
    id: img_sleep1
    resize: ${imagewidth}x${imageheight}
    type: RGB565
  - file: ${img_base}/idle_sleep_f2.png
    id: img_sleep2
    resize: ${imagewidth}x${imageheight}
    type: RGB565
  - file: ${img_base}/idle_sleep_f3.png
    id: img_sleep3
    resize: ${imagewidth}x${imageheight}
    type: RGB565
  - file: ${img_base}/listening.png
    id: img_listening
    resize: ${imagewidth}x${imageheight}
    type: RGB565
  - file: ${img_base}/thinking.png
    id: img_thinking
    resize: ${imagewidth}x${imageheight}
    type: RGB565
  - file: ${img_base}/replying.png
    id: img_replying
    resize: ${imagewidth}x${imageheight}
    type: RGB565
  - file: ${img_base}/error.png
    id: img_error
    resize: ${imagewidth}x${imageheight}
    type: RGB565

display:
  - platform: mipi_spi
    id: main_display
    model: JC3636W518V2
    cs_pin: 14
    reset_pin: 3          # GPIO3 on V1.0/V1.1 (GPIO4 on V1.2)
    rotation: ${rotate_display}
    update_interval: never  # redraw only on phase/frame change (component.update below)
    dimensions:
      height: ${imageheight}
      width: ${imagewidth}
    pages:
      - id: status_page
        lambda: |-
          // phase: 0 awake idle (glance frames via awake_frame), 6 sleeping
          // (sleep frames via sleep_frame), 1 listening, 2 thinking,
          // 3 replying, 4 error, 5 loading
          esphome::image::Image *img = id(img_idle);
          if (id(status_phase) == 6) {
            img = id(img_sleep0);
            switch (id(sleep_frame)) {
              case 1:  img = id(img_sleep1); break;
              case 2:  img = id(img_sleep2); break;
              case 3:  img = id(img_sleep3); break;
              default: break;
            }
          } else if (id(status_phase) == 0) {
            switch (id(awake_frame)) {
              case 1:  img = id(img_idle_f1); break;
              case 2:  img = id(img_idle_f2); break;
              case 3:  img = id(img_idle_f3); break;
              default: break;
            }
          } else switch (id(status_phase)) {
            case 1:  img = id(img_listening); break;
            case 2:  img = id(img_thinking);  break;
            case 3:  img = id(img_replying);  break;
            case 4:  img = id(img_error);     break;
            case 5:  img = id(img_loading);   break;
            default: break;
          }
          it.fill(Color::BLACK);
          it.image(it.get_width() / 2, it.get_height() / 2, img, ImageAlign::CENTER);

globals:
  - id: status_phase
    type: int
    restore_value: no
    initial_value: "5"   # loading until boot sets awake idle
  - id: drawn_phase
    type: int
    restore_value: no
    initial_value: "-1"  # forces the first draw
  - id: awake_frame
    type: int
    restore_value: no
    initial_value: "0"   # glance frame while awake idle (0 = centered)
  - id: sleep_frame
    type: int
    restore_value: no
    initial_value: "0"   # sleep animation frame while phase 6
  - id: glancing
    type: bool
    restore_value: no
    initial_value: "false"
  - id: glance_dir
    type: int
    restore_value: no
    initial_value: "1"
  - id: glance_depth
    type: int
    restore_value: no
    initial_value: "2"
  - id: glance_pos
    type: int
    restore_value: no
    initial_value: "0"
  - id: idle_seconds
    type: int
    restore_value: no
    initial_value: "0"   # seconds spent in awake idle; >= 180 -> sleeping

script:
  - id: set_status
    parameters:
      phase: int
      label: string
    then:
      - lambda: |-
          id(status_phase) = phase;
          ESP_LOGI("STATUS", "%s", label.c_str());
      # Push the frame immediately, but only when the phase actually changes.
      # With update_interval: never, animation frames below call component.update
      # directly (they keep the same phase).
      - if:
          condition:
            lambda: return id(status_phase) != id(drawn_phase);
          then:
            - lambda: id(drawn_phase) = id(status_phase);
            - component.update: main_display
  # Sporadic slow glance while awake idle (phase 0), same behavior as the HTML
  # page preview: 2-3 frames out to a random side, then back to center (0).
  - id: glance
    then:
      - lambda: |-
          id(glance_dir) = (rand() % 2 == 0) ? 1 : -1;   // +1 right (f1,f2,f3), -1 left (f3,f2,f1)
          id(glance_depth) = 2 + rand() % 2;             // 2 or 3 frames out
          id(glance_pos) = 0;
          id(glancing) = true;
      - script.execute: glance_tick
  - id: glance_tick
    then:
      - lambda: |-
          int i = id(glance_pos), d = id(glance_depth);
          int f;
          if (i < d) {
            f = (id(glance_dir) == 1) ? i + 1 : 3 - i;          // out
          } else if (i < 2 * d - 1) {
            int k = 2 * d - 2 - i;
            f = (id(glance_dir) == 1) ? k + 1 : 3 - k;          // back
          } else {
            f = 0;                                              // center
          }
          id(awake_frame) = f;
          id(glance_pos) = i + 1;
      - component.update: main_display
      - delay: 450ms   // slow, one frame per tick
      - if:
          condition:
            lambda: return id(glance_pos) < 2 * id(glance_depth);
          then:
            - script.execute: glance_tick
          else:
            - lambda: id(glancing) = false;

interval:
  # Glance trigger: every 2 s, 30% chance, only while awake idle and not
  # already glancing (same odds as the HTML preview).
  - interval: 2s
    then:
      - if:
          condition:
            lambda: return id(status_phase) == 0 && !id(glancing) && (rand() % 10 < 3);
          then:
            - script.execute: glance
  # Sleeping animation: continuous loop of the 4 sleep frames at 5 fps,
  # only in phase 6.
  - interval: 200ms
    then:
      - if:
          condition:
            lambda: return id(status_phase) == 6;
          then:
            - lambda: id(sleep_frame) = (id(sleep_frame) + 1) % 4;
            - component.update: main_display
  # Inactivity: 3 min in awake idle -> sleeping mode (phase 6).
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return id(status_phase) == 0;
          then:
            - lambda: id(idle_seconds) = id(idle_seconds) + 1;
            - if:
                condition:
                  lambda: return id(idle_seconds) >= 180;
                then:
                  - script.execute:
                      id: set_status
                      phase: 6
                      label: "Sleeping..."
          else:
            - lambda: id(idle_seconds) = 0;
  - interval: 10s
    then:
      - lambda: |-
          ESP_LOGI("MAIN", "heartbeat: free_heap=%u mic_running=%d va_running=%d",
                   (unsigned) esp_get_free_heap_size(),
                   (int) id(box_mic).is_running(),
                   (int) id(va).is_running());
